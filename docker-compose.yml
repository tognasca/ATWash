services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atwash}
      POSTGRES_USER: ${POSTGRES_USER:-atwash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atwash} -d ${POSTGRES_DB:-atwash}"]
      interval: 5s
      retries: 10
  api:
    build: ./src/ATWash.Api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ATWASH_BOOTSTRAP_ADMIN: ${ATWASH_BOOTSTRAP_ADMIN:-false}
      ATWASH_ADMIN_EMAIL: ${ATWASH_ADMIN_EMAIL:-}
      ATWASH_ADMIN_PASSWORD: ${ATWASH_ADMIN_PASSWORD:-}
      ATWASH_COMPANY_NAME: ${ATWASH_COMPANY_NAME:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY in .env}
      ATWASH_CORS_ORIGINS: ${ATWASH_CORS_ORIGINS:-https://localhost}
      ATWASH_APPLY_MIGRATIONS: ${ATWASH_APPLY_MIGRATIONS:-false}
      ATWASH_SEED_DEMO: ${ATWASH_SEED_DEMO:-false}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-atwash};Username=${POSTGRES_USER:-atwash};Password=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5098:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./src/atwash-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ATWASH_FRONTEND_PORT:-8087}:80"
    depends_on:
      - api
volumes:
  pgdata:
