name: Build configured ATWash Android APK
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL HTTPS pública da API ATWash, sem /api'
        required: true
        type: string
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate API endpoint
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          [[ "$API_URL" =~ ^https://[^/]+ ]] || { echo 'Provide an HTTPS API URL'; exit 1; }
      - name: Android SDK packages
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - run: npm install --no-audit --no-fund
        working-directory: src/atwash-web
      - name: Build with real API URL
        env:
          VITE_API_BASE_URL: ${{ inputs.api_url }}
        run: npm run build
        working-directory: src/atwash-web
      - run: npx cap add android && npx cap sync android
        working-directory: src/atwash-web
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: src/atwash-web/android
      - uses: actions/upload-artifact@v4
        with:
          name: atwash-android-configured-debug
          path: src/atwash-web/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
