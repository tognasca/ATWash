name: Build API
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/ATWash.Api/ATWash.Api.csproj
      - run: dotnet build src/ATWash.Api/ATWash.Api.csproj -c Release --no-restore
