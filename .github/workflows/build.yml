name: Build and integration tests
concurrency:
  group: atwash-build-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      android_api_url:
        description: 'Public HTTPS API origin for configured Android test APK (leave blank for unconfigured build)'
        required: false
        type: string
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atwash_test
          POSTGRES_USER: atwash
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atwash -d atwash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=atwash_test;Username=atwash;Password=integration-only-password
      JWT_SECRET_KEY: ci-integration-only-secret-at-least-32-characters-long
      ATWASH_APPLY_MIGRATIONS: 'true'
      ATWASH_BOOTSTRAP_ADMIN: 'true'
      ATWASH_ADMIN_EMAIL: integration@atwash.test
      ATWASH_ADMIN_PASSWORD: IntegrationOnlyPassword2026!
      ATWASH_COMPANY_NAME: ATWash Integration
      ATWASH_PLATFORM_ADMIN_KEY: ci-platform-key-only-please-never-use-in-production-2026
      ATWASH_LOGIN_RATE_LIMIT: '50'
      ASPNETCORE_URLS: http://127.0.0.1:5098
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/ATWash.Api/ATWash.Api.csproj
      - run: dotnet build src/ATWash.Api/ATWash.Api.csproj -c Release --no-restore
      - name: Apply all migrations and start API
        run: |
          dotnet run --project src/ATWash.Api/ATWash.Api.csproj -c Release --no-build > /tmp/atwash-api.log 2>&1 &
          echo $! > /tmp/atwash-api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5098/health; then exit 0; fi
            if ! kill -0 "$(cat /tmp/atwash-api.pid)" 2>/dev/null; then cat /tmp/atwash-api.log; exit 1; fi
            sleep 2
          done
          cat /tmp/atwash-api.log
          exit 1
      - name: Verify migration history
        run: |
          PGPASSWORD=integration-only-password psql -h localhost -U atwash -d atwash_test -Atc 'SELECT "MigrationId" FROM "__EFMigrationsHistory" ORDER BY "MigrationId"' > /tmp/migrations.txt
          cat /tmp/migrations.txt
          test "$(wc -l < /tmp/migrations.txt)" -eq 9
          grep -q '20261112170000_AddCashAndReconciliation' /tmp/migrations.txt
          grep -q '20261112180000_AddInventoryLedger' /tmp/migrations.txt
          grep -q '20261112190000_OperationsAndRecipes' /tmp/migrations.txt
          grep -q '20261112200000_AddDevicesAndSaas' /tmp/migrations.txt
          grep -q '20261113210000_AddMercadoPagoSubscriptions' /tmp/migrations.txt
      - name: Integration tests (API and PostgreSQL)
        run: python3 tests/integration_smoke.py
      - name: Verify backup and restore in isolated database
        run: |
          DB_CONTAINER=$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -n 1)
          test -n "$DB_CONTAINER"
          docker exec "$DB_CONTAINER" pg_dump -U atwash -d atwash_test -Fc --no-owner --no-acl -f /tmp/atwash-test.dump
          docker exec "$DB_CONTAINER" test -s /tmp/atwash-test.dump
          docker exec "$DB_CONTAINER" psql -U atwash -d postgres -c 'CREATE DATABASE atwash_restore_test'
          docker exec "$DB_CONTAINER" pg_restore -U atwash -d atwash_restore_test --no-owner --no-acl --exit-on-error /tmp/atwash-test.dump
          SOURCE=$(docker exec "$DB_CONTAINER" psql -U atwash -d atwash_test -Atc 'SELECT count(*) FROM "Orders"')
          RESTORED=$(docker exec "$DB_CONTAINER" psql -U atwash -d atwash_restore_test -Atc 'SELECT count(*) FROM "Orders"')
          test "$SOURCE" = "$RESTORED"
          test "$RESTORED" -gt 0
      - name: API logs on failure
        if: failure()
        run: cat /tmp/atwash-api.log || true
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
        working-directory: src/atwash-web
      - run: npm run build
        working-directory: src/atwash-web
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER" || { echo "Android command-line tools not installed"; exit 1; }
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - run: npm install --no-audit --no-fund
        working-directory: src/atwash-web
      - name: Validate Android API endpoint
        if: github.event_name == 'workflow_dispatch' && inputs.android_api_url != ''
        env:
          API_URL: ${{ inputs.android_api_url }}
        run: |
          python3 - <<'PY'
          import os,urllib.parse
          url=urllib.parse.urlparse(os.environ['API_URL'])
          assert url.scheme=='https' and url.hostname and not url.username and not url.password and not url.fragment and not url.query and url.path in ('','/'), 'Provide an HTTPS API origin without path, credentials or query'
          PY
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ inputs.android_api_url || '' }}
        working-directory: src/atwash-web
      - run: npx cap add android
        working-directory: src/atwash-web
      - run: npx cap sync android
        working-directory: src/atwash-web
      - name: Build unsigned debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: src/atwash-web/android
      - uses: actions/upload-artifact@v4
        with:
          name: atwash-android-debug
          path: src/atwash-web/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
